server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same service name in docker-compose and Kubernetes, so one config works in both.
    location /api/ {
        proxy_pass http://settlement-backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
